org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=false
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xss10240k
org.gradle.vfs.watch=true
offlineRepositoryRoot=offline-repository
signing.gnupg.executable=gpg
signing.gnupg.useLegacyGpg=true

# Use ./update_version.sh to update the LinkedIn Java fork version here.
# LinkedIn development builds append -SNAPSHOT; -PisRelease selects the bare
# version, and -PisSnapshot requests a snapshot even with -PisRelease.
version=2.75.1
sdk_version=2.75.1

javaVersion=11

docker_image_default_repo_root=apache
docker_image_default_repo_prefix=beam_

# supported flink versions
flink_versions=1.19,1.20,2.0,2.1,2.2
# supported spark versions
spark_versions=3,4
# supported python versions
python_versions=3.10,3.11,3.12,3.13,3.14

# Maven Central fallback mirror URL
mavenCentralMirrorUrl=https://maven-central.storage-download.googleapis.com/maven2/
