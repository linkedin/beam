gradle.beforeProject { project ->
  project.plugins.withId('net.linguica.maven-settings') {
    project.extensions.getByName('mavenSettings').userSettingsFileName =
        project.property('publicationTestSettings').toString()
  }
  project.afterEvaluate {
    if (project.plugins.hasPlugin('maven-publish')) {
      project.tasks.register('checkLinkedinPublication') {
        dependsOn 'generatePomFileForMavenJavaPublication'
        if (project.path == ':sdks:java:core') {
          dependsOn 'processResources'
        }
        doLast {
          def group = project.property('expectedPublicationGroup')
          def version = project.property('expectedPublicationVersion')
          def publication = project.extensions.getByType(org.gradle.api.publish.PublishingExtension)
          def pom = new XmlSlurper().parse(
              project.file("${project.buildDir}/publications/mavenJava/pom-default.xml"))
          assert pom.groupId.text() == group : "${project.path}: unexpected group"
          assert pom.version.text() == version : "${project.path}: unexpected version"
          assert pom.artifactId.text() == project.archivesBaseName
          assert project.version.toString() == version
          if (project.path == ':sdks:java:core') {
            def properties = new Properties()
            project.file("${project.buildDir}/resources/main/org/apache/beam/sdk/sdk.properties").withInputStream {
              properties.load(it)
            }
            assert properties.getProperty('version') == version
          }

          pom.dependencies.dependency.each { dependency ->
            assert dependency.artifactId.text() != 'beam-' :
                "${project.path}: dependency project has not been configured"
            if (dependency.artifactId.text().startsWith('beam-') &&
                !dependency.artifactId.text().startsWith('beam-vendor-')) {
              assert dependency.groupId.text() == group :
                  "${project.path}: mixed fork dependency ${dependency.artifactId}"
              assert dependency.version.text() == version :
                  "${project.path}: inconsistent fork dependency ${dependency.artifactId}"
            }
          }
          if (project.path == ':sdks:java:io:google-cloud-platform') {
            assert pom.dependencyManagement.dependencies.dependency.any {
              it.scope.text() == 'import' && it.type.text() == 'pom'
            } : 'Versionless Google Cloud dependencies require their BOM even in snapshots'
          }
          if (project.path == ':sdks:java:extensions:protobuf') {
            def bom = project.library.java.google_cloud_platform_libraries_bom.split(':')
            assert pom.dependencyManagement.dependencies.dependency.any {
              it.groupId.text() == bom[0] && it.artifactId.text() == bom[1] &&
                  it.version.text() == bom[2] && it.scope.text() == 'import' &&
                  it.type.text() == 'pom'
            } : 'Protobuf must publish the shared Google Cloud BOM'
            def storage = pom.dependencies.dependency.findAll {
              it.groupId.text() == 'com.google.cloud' &&
                  it.artifactId.text() == 'google-cloud-storage'
            }
            assert storage.size() == 1 && storage[0].version.text().isEmpty() :
                'Protobuf storage must use the published BOM, not an obsolete literal version'
            def apicurio = pom.dependencies.dependency.find {
              it.groupId.text() == 'io.apicurio' &&
                  it.artifactId.text() == 'apicurio-registry-protobuf-schema-utilities'
            }
            assert apicurio != null && apicurio.exclusions.exclusion.any {
              it.groupId.text() == 'com.squareup.wire' && it.artifactId.text() == 'wire-compiler'
            } : 'The published Apicurio edge must exclude the unused Wire compiler'
            def artifacts = project.configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
            assert !artifacts.any {
              it.moduleVersion.id.group == 'com.charleskorn.kaml' ||
                  (it.moduleVersion.id.group == 'com.squareup.wire' &&
                   it.moduleVersion.id.name == 'wire-compiler')
            } : 'Protobuf runtime must not inherit compiler-only YAML dependencies'
            def grpc = artifacts.find {
              it.moduleVersion.id.group == 'io.grpc' &&
                  it.moduleVersion.id.name == 'grpc-netty-shaded'
            }
            assert grpc != null && grpc.moduleVersion.id.version.matches(/\d+\.\d+\.\d+/)
            def grpcVersion = grpc.moduleVersion.id.version.tokenize('.').collect { it.toInteger() }
            assert grpcVersion[0] > 1 || (grpcVersion[0] == 1 && grpcVersion[1] >= 75) :
                'Protobuf requires grpc-netty-shaded 1.75.0 or newer'
          }
          if (group == 'com.linkedin.beam') {
            assert publication.repositories.every { it.url.scheme == 'file' } :
                'LinkedIn local packaging must not register a remote upload destination'
          } else {
            assert publication.repositories.any {
              it.url.host == 'repository.apache.org'
            } : 'Non-LinkedIn publication configuration must remain available'
          }
        }
      }
    }
  }
}
