import org.gradle.api.publish.maven.tasks.AbstractPublishToMaven
import org.gradle.api.publish.maven.tasks.PublishToMavenRepository
import org.gradle.api.publish.PublishingExtension

gradle.taskGraph.whenReady { graph ->
  graph.allTasks.findAll { it instanceof PublishToMavenRepository }.each {
    assert it.repository.url.scheme == 'file' : 'Network publication is forbidden in these tests'
  }
}

def expectedProjects = [
  ':model:pipeline', ':model:fn-execution', ':model:job-management',
  ':runners:core-java', ':runners:direct-java', ':runners:java-fn-execution',
  ':runners:java-job-service', ':runners:flink:1.20', ':runners:flink:2.2',
  ':runners:spark:3', ':runners:portability:java',
  ':sdks:java:core', ':sdks:java:expansion-service', ':sdks:java:harness',
  ':sdks:java:extensions:arrow', ':sdks:java:extensions:avro',
  ':sdks:java:extensions:protobuf', ':sdks:java:extensions:google-cloud-platform-core',
  ':sdks:java:extensions:join-library', ':sdks:java:extensions:sorter',
  ':sdks:java:extensions:sql', ':sdks:java:extensions:sql:udf',
  ':sdks:java:io:hadoop-common', ':sdks:java:io:hadoop-file-system',
  ':sdks:java:io:hadoop-format', ':sdks:java:io:kafka', ':sdks:java:io:mongodb',
  ':sdks:java:io:google-cloud-platform', ':sdks:java:io:parquet',
  ':sdks:java:transform-service:launcher'
] as Set
def expectedRoots = expectedProjects - [
  ':model:fn-execution', ':model:job-management', ':runners:direct-java',
  ':runners:java-job-service', ':sdks:java:expansion-service', ':sdks:java:harness',
  ':sdks:java:extensions:arrow', ':sdks:java:extensions:sql:udf',
  ':sdks:java:transform-service:launcher'
]

gradle.beforeProject { project ->
  project.tasks.withType(AbstractPublishToMaven).configureEach { publisher ->
    if (project.hasProperty('publicationEvents')) {
      def events = project.file(project.property('publicationEvents'))
      def record = { String state ->
        synchronized (events.absolutePath.intern()) {
          events << "${state}\t${publisher.path}\n"
        }
      }
      publisher.doFirst {
        record('start')
        if (project.findProperty('publicationFailure') == project.path) {
          throw new GradleException("Injected publication failure: ${project.path}")
        }
      }
      publisher.doLast { record('done') }
    }
  }
  if (project.path == ':auto-elr') {
    project.afterEvaluate {
      project.tasks.register('checkAutoElrPublication') {
        if (project.plugins.hasPlugin('maven-publish')) {
          dependsOn 'generatePomFileForMavenJavaPublication'
        }
        doLast {
          if (project.property('expectedPublicationGroup') != 'com.linkedin.beam') {
            assert !project.plugins.hasPlugin('maven-publish')
            return
          }
          def pom = new XmlSlurper().parse(
              project.file("${project.buildDir}/publications/mavenJava/pom-default.xml"))
          assert pom.groupId.text() == 'com.linkedin.beam'
          assert pom.artifactId.text() == 'beam-auto-elr'
          assert pom.version.text() == project.property('expectedPublicationVersion')
          def dependencies = pom.dependencies.dependency.findAll {
            it.groupId.text() == 'com.linkedin.beam'
          }
          assert dependencies.size() == 21
          assert (dependencies.collect { it.artifactId.text() } as Set) ==
              (expectedRoots.collect { 'beam' + it.replace(':', '-') } as Set)
          dependencies.each {
            assert it.groupId.text() == 'com.linkedin.beam'
            assert it.version.text() == pom.version.text()
            assert expectedProjects.any { path -> it.artifactId.text() == 'beam' + path.replace(':', '-') }
          }
          def name = project.findProperty('publicationTask') ?:
              'publishMavenJavaPublicationToMavenLocal'
          def publisher = project.tasks.getByName(name)
          def publications = publisher.taskDependencies.getDependencies(publisher)
              .findAll { it instanceof AbstractPublishToMaven }
              .collect { it.path } as Set
          assert publications == (expectedProjects.collect { it + ':' + name } as Set) :
              "Aggregator must schedule its complete publication closure: ${publications}"
        }
      }
      project.tasks.register('checkLinkedinPublicationGuard') {
        doLast {
          def publication = project.extensions.getByType(PublishingExtension)
          def repository = publication.repositories.getByName('linkedin.jfrog.https')
          assert repository.url.toString() == 'https://linkedin.jfrog.io/artifactory/beam/'
          assert repository.credentials.username == 'publication-test'
          assert repository.credentials.password == 'not-a-real-key'
          assert !project.plugins.hasPlugin('net.linguica.maven-settings')
          project.rootProject.repositories(project.rootProject.ext.repositories)
          assert project.rootProject.repositories.findByName('linkedin.jfrog.https') == null
          def name = 'publishMavenJavaPublicationToLinkedin.jfrog.httpsRepository'
          def validation = project.rootProject.tasks.getByName('validateLinkedinPublication')
          (expectedProjects + [':auto-elr']).each { path ->
            def publisher = project.rootProject.project(path).tasks.getByName(name)
            assert validation in publisher.taskDependencies.getDependencies(publisher)
          }
          def entrypoint = project.tasks.getByName('publishLinkedin')
          assert project.tasks.getByName(name) in entrypoint.taskDependencies.getDependencies(entrypoint)

          def plugin = project.plugins.getPlugin('org.apache.beam.module')
          def valid = [
            ref: 'refs/heads/li-release-2.75', allowedWorkflow: true, clean: true,
            configuredVersion: '2.75.1', version: '2.75.1', sdkVersion: '2.75.1',
            expectedVersion: '2.75.1', username: 'publication-test', token: 'not-a-real-key'
          ]
          plugin.validateLinkedinPublication(valid)
          plugin.validateLinkedinPublication(valid + [ref: 'refs/heads/li_trunk'])
          plugin.validateLinkedinPublication(valid + [
            version: '2.75.1-SNAPSHOT', expectedVersion: '2.75.1-SNAPSHOT'
          ])
          [
            [[ref: 'refs/heads/feature/test'], 'requires li_trunk'],
            [[ref: 'refs/tags/2.75.1'], 'requires li_trunk'],
            [[ref: 'refs/pull/1/merge'], 'requires li_trunk'],
            [[allowedWorkflow: false], 'requires workflow_dispatch'],
            [[clean: false], 'requires a clean git worktree'],
            [[expectedVersion: null], 'Confirm the checked-in'],
            [[expectedVersion: '2.75.2'], 'Confirm the checked-in'],
            [[version: '2.75.2', expectedVersion: '2.75.2'], 'Confirm the checked-in'],
            [[configuredVersion: '2.75.1-SNAPSHOT'], 'Confirm the checked-in'],
            [[sdkVersion: '2.75.0'], 'Confirm the checked-in'],
            [[username: ''], 'requires ARTIFACTORY_USER'],
            [[token: ' '], 'requires ARTIFACTORY_USER']
          ].each { testCase ->
            boolean rejected = false
            try {
              plugin.validateLinkedinPublication(valid + testCase[0])
            } catch (GradleException failure) {
              assert failure.message.contains(testCase[1])
              rejected = true
            }
            assert rejected : "Publication guard accepted ${testCase[0].keySet()}"
          }
        }
      }
    }
  }
}
