name: LI JFrog Artifactory Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact artifact version, for example 2.75.1 or 2.75.1-SNAPSHOT'
        required: true
        type: string
      publish:
        description: 'Upload to JFrog after validation (false stages locally only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: li-beam-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'linkedin/beam' &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/li_trunk' || startsWith(github.ref, 'refs/heads/li-release-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      snapshot: ${{ steps.version.outputs.snapshot }}
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify requested version
        id: version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('gradle.properties').read_text()
          base = re.search(r'^version=(.+)$', text, re.MULTILINE).group(1)
          expected = os.environ['EXPECTED_VERSION']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', base) or expected not in (base, base + '-SNAPSHOT'):
              raise SystemExit('Requested version must match gradle.properties (optionally with -SNAPSHOT)')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('snapshot=' + str(expected.endswith('-SNAPSHOT')).lower() + '\n')
          PY
  validate_contracts:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: false
      - uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin
      - name: Validate LinkedIn build and publication contracts
        run: |
          ./gradlew :beam-test-gha:check --no-daemon --no-build-cache
          python3 release/src/test/scripts/test_linkedin_build.py -v
  validate_runners:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PUBLISH_SNAPSHOT: ${{ needs.prepare.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: false
      - uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin
      - name: Validate Java and supported runners
        run: >-
          ./gradlew :buildSrc:check :runners:spark:spotlessCheck
          :sdks:java:core:check :runners:core-java:check
          :sdks:java:harness:check :sdks:java:extensions:avro:check
          :sdks:java:extensions:protobuf:check
          :runners:flink:1.19:build :runners:flink:1.20:build
          :runners:flink:2.0:build :runners:flink:2.1:build :runners:flink:2.2:build
          :runners:flink:1.20:validatesRunner :runners:flink:2.2:validatesRunner
          :runners:spark:3:build :runners:spark:3:validatesRunner
          :runners:spark:3:sparkVersionsTest :auto-elr:check
          -Ppublishing -PisLinkedin -PisRelease -PlinkedinPublish -PnoSigning
          "-PisSnapshot=$PUBLISH_SNAPSHOT"
          --continue --rerun-tasks --no-build-cache --no-daemon --max-workers=2
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linkedin-publisher-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
  publish:
    needs: [prepare, validate_contracts, validate_runners]
    if: >-
      success() &&
      github.repository == 'linkedin/beam' &&
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/li_trunk' || startsWith(github.ref, 'refs/heads/li-release-'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      PUBLISH_SNAPSHOT: ${{ needs.prepare.outputs.snapshot }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache: false
      - uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin
      - name: Stage complete publication locally
        run: >-
          ./gradlew :auto-elr:publishMavenJavaPublicationToMavenLocal
          -Ppublishing -PisLinkedin -PisRelease -PlinkedinPublish -PnoSigning
          "-PisSnapshot=$PUBLISH_SNAPSHOT"
          "-Dmaven.repo.local=$RUNNER_TEMP/beam-publication"
          --rerun-tasks --no-build-cache --no-daemon --max-workers=2
      - name: Publish required artifacts and Auto ELR marker
        if: inputs.publish
        env:
          ARTIFACTORY_USER: ${{ secrets.ARTIFACTORY_USER }}
          ARTIFACTORY_KEY: ${{ secrets.ARTIFACTORY_KEY }}
        run: >-
          ./gradlew :auto-elr:publishLinkedin
          -Ppublishing -PisLinkedin -PisRelease -PlinkedinPublish -PnoSigning
          "-PisSnapshot=$PUBLISH_SNAPSHOT" "-PlinkedinVersion=$EXPECTED_VERSION"
          --no-build-cache --no-daemon --max-workers=2
