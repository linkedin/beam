buildscript {
  repositories {
    def mirrorUrl = project.findProperty("mavenCentralMirrorUrl")
    boolean isCi = System.getenv("GITHUB_ACTIONS") != null || System.getenv("JENKINS_HOME") != null
    def useMirror = isCi && mirrorUrl

    if (!useMirror) {
      mavenCentral()
    } else {
      maven { url mirrorUrl }
    }
  }
  dependencies {
    classpath group: 'org.yaml', name: 'snakeyaml', version: '2.2'
  }
}

/** check that yml are valid */
task check {
  doLast {
    def workflowDoc = new File("${project.projectDir}/workflows/README.md").text
    List<String> errors = []
    fileTree("${project.projectDir}/workflows").matching {
      include "*.yml"
      include "*.yaml"
    }.each {
      def fname = it.getName()
      // attempt load yml to make sure its valid
      def workflow = new org.yaml.snakeyaml.Yaml().load(it.newInputStream())

      if (fname == 'li_maven_publish.yml') {
        def trigger = workflow.getAt(true)
        def inputs = trigger?.workflow_dispatch?.inputs
        def publisher = workflow.jobs?.publish
        def expectedCondition = "github.repository == 'linkedin/beam' && " +
            "github.event_name == 'workflow_dispatch' && " +
            "(github.ref == 'refs/heads/li_trunk' || startsWith(github.ref, 'refs/heads/li-release-'))"
        if (trigger?.keySet() != (['workflow_dispatch'] as Set) ||
            inputs?.version?.required != true || inputs?.version?.type != 'string' ||
            inputs?.publish?.type != 'boolean' || inputs?.publish?.get('default') != false) {
          errors.add('LinkedIn publishing must be manual, version-confirmed and dry-run by default')
        }
        if (publisher?.get('if')?.replaceAll(/\s+/, ' ')?.trim() != expectedCondition) {
          errors.add('LinkedIn publishing must restrict repository, event and release branch')
        }
        if (workflow.permissions != [contents: 'read'] ||
            workflow.concurrency?.group != 'li-beam-publish-${{ inputs.version }}' ||
            workflow.concurrency?.get('cancel-in-progress') != false) {
          errors.add('LinkedIn publishing must use read-only GitHub permissions and serialize versions')
        }
        def uploads = publisher?.steps?.findAll {
          it.run?.contains(':auto-elr:publishLinkedin')
        }
        if (uploads?.size() != 1 || uploads[0].get('if') != 'inputs.publish' ||
            uploads[0].env != [
              ARTIFACTORY_USER: '${{ secrets.ARTIFACTORY_USER }}',
              ARTIFACTORY_KEY: '${{ secrets.ARTIFACTORY_KEY }}'
            ]) {
          errors.add('Only the explicitly enabled upload step may publish with JFrog credentials')
        }
        if (publisher?.env?.keySet()?.any { it.startsWith('ARTIFACTORY_') }) {
          errors.add('JFrog credentials must not be exposed to validation or local staging')
        }
        def credentialSteps = publisher?.steps?.findAll {
          it.env?.values()?.any { value -> value.toString().contains('secrets.ARTIFACTORY_') }
        }
        if (credentialSteps != uploads) {
          errors.add('Only the upload step may reference JFrog secrets')
        }
      }

      // additional guards to ensure tests configured in same way
      if ( fname.startsWith("beam_PreCommit") || fname.startsWith("beam_PostCommit") ) {
        List paths
        try {
          paths = workflow.getAt(true).pull_request_target.paths as List
        } catch (Exception e) {
          errors.add("Fail to get the trigger path for ${fname}. " +
                    "Make sure it has a pull_request_target trigger.")
          return
        }

        // precommit and postcommit should be triggered by this specific file
        // this is to ensure not missing test during release branch verification
        if (paths != null && !paths.contains('release/trigger_all_tests.json') && !fname.toLowerCase().contains('sickbay') && !workflow.name.toLowerCase().contains('disabled')) {
          errors.add("Error validating ${fname}: " +
                  "Please add 'release/trigger_all_tests.json' to the trigger path")
          return
        }

        // postcommit should be triggered by a specific file so that there is a way to exercise post for open PR
        // TODO(https://github.com/apache/beam/issues/28909)
        //  remove file match trigger once a better trigger (e.g. comment trigger) is implemented
        if (fname.startsWith("beam_PostCommit")) {
          String triggerFile = '.github/trigger_files/' + fname.take(fname.lastIndexOf('.')) + '.json'
          if (paths != null && !paths.contains(triggerFile)) {
            errors.add("Error validating ${fname}: " +
                    "Please add ${triggerFile} to the trigger path")
            return
          }
        }
      }

      // Make sure the workflow is listed in README.md
      if ( fname.startsWith("beam_") && !workflowDoc.contains(fname)) {
        errors.add("Workflow ${fname} not listed in workflows/README.md");
      }
    }
    if (!errors.isEmpty()) {
      throw new GradleException("Check failed: " + errors.join('\n'))
    }
  }
}

task preCommit {
  dependsOn check
}